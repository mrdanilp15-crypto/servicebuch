name: Build and publish Docker images

# Baut backend/ und frontend/ als Docker-Images, startet sie testweise und
# veröffentlicht sie erst dann als ":latest" in der GitHub Container
# Registry (ghcr.io) - genau die Images, die docker-compose.yml per
# "image:" referenziert. Ein Image, das den Smoke-Test nicht besteht,
# landet NIE auf ":latest" (nur unter dem Commit-SHA-Tag, zur Diagnose).
# Läuft automatisch bei jedem Push auf main (nur wenn sich backend/,
# frontend/ oder dieser Workflow geändert haben) und lässt sich
# zusätzlich manuell auslösen.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (für arm64-Builds, z.B. Raspberry Pi / ARM-NAS)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur mit dem Commit-SHA getaggt - ":latest" wird erst unten gesetzt,
      # wenn der Smoke-Test erfolgreich war.
      - name: Build and push (SHA tag only)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/servicebuch-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Testet BEIDE Plattformen (amd64 UND arm64, über QEMU-Emulation) -
      # ein Bug, der nur unter einer Architektur auftritt (z.B. Prisma auf
      # Alpine/musl/arm64), wird damit vor der Veröffentlichung erkannt.
      - name: Smoke test backend image (amd64 + arm64)
        if: matrix.service == 'backend'
        run: |
          set -e
          for platform in linux/amd64 linux/arm64; do
            name="smoke-$(echo $platform | tr '/' '-')"
            echo "=== Testing $platform ==="
            docker run -d --name "$name" --platform "$platform" \
              -e DATABASE_URL=file:/app/data/dev.db \
              -e DATA_DIR=/app/data \
              -p 4000:4000 \
              ghcr.io/${{ github.repository_owner }}/servicebuch-backend:${{ github.sha }}
            ok=""
            for i in $(seq 1 30); do
              if curl -sf http://localhost:4000/api/health >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "--- $platform container logs ---"
              docker logs "$name" || true
              docker rm -f "$name" || true
              echo "::error::Backend-Image ($platform) ist nicht gesund geworden (siehe Logs oben) - wird NICHT als :latest veröffentlicht."
              exit 1
            fi
            # /api/health prüft nur, dass der Prozess läuft - registriert
            # aber testet den kompletten Pfad inkl. Argon2 (natives Modul!)
            # und einem echten Prisma-Datenbank-Write, nicht nur "lädt".
            reg_code=$(curl -s -o /tmp/register_response.json -w "%{http_code}" \
              -X POST http://localhost:4000/api/auth/register \
              -H "Content-Type: application/json" \
              -d '{"email":"smoketest@example.com","password":"SmokeTest123!","name":"Smoke Test"}')
            echo "--- $platform container logs ---"
            docker logs "$name" || true
            docker rm -f "$name" || true
            if [ "$reg_code" != "201" ]; then
              echo "--- register response ---"
              cat /tmp/register_response.json || true
              echo "::error::Backend-Image ($platform): POST /api/auth/register lieferte HTTP $reg_code statt 201 (siehe Logs/Response oben) - wird NICHT als :latest veröffentlicht."
              exit 1
            fi
            echo "$platform OK (health + register/Argon2/Prisma-Write)"
          done
          echo "Backend-Smoke-Test erfolgreich (amd64 + arm64)."

      - name: Smoke test frontend image (amd64 + arm64)
        if: matrix.service == 'frontend'
        run: |
          set -e
          for platform in linux/amd64 linux/arm64; do
            name="smoke-$(echo $platform | tr '/' '-')"
            echo "=== Testing $platform ==="
            docker run -d --name "$name" --platform "$platform" -p 3000:3000 \
              ghcr.io/${{ github.repository_owner }}/servicebuch-frontend:${{ github.sha }}
            ok=""
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            echo "--- $platform container logs ---"
            docker logs "$name" || true
            docker rm -f "$name" || true
            if [ -z "$ok" ]; then
              echo "::error::Frontend-Image ($platform) liefert /login nicht aus (siehe Logs oben) - wird NICHT als :latest veröffentlicht."
              exit 1
            fi
            echo "$platform OK"
          done
          echo "Frontend-Smoke-Test erfolgreich (amd64 + arm64)."

      # Kopiert den bereits gepushten (und getesteten) Multi-Arch-Manifest
      # auf den Tag ":latest" - kein erneuter Build nötig.
      - name: Promote to :latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/servicebuch-${{ matrix.service }}:latest \
            ghcr.io/${{ github.repository_owner }}/servicebuch-${{ matrix.service }}:${{ github.sha }}
