name: Build and publish Docker images

# Baut backend/ und frontend/ als Docker-Images, testet sie einzeln UND im
# Verbund (Frontend-Proxy -> Backend, über ein echtes Docker-Netzwerk -
# genau der Aufbau, den docker-compose.yml auch produziert) und
# veröffentlicht sie erst DANACH als ":latest" in der GitHub Container
# Registry (ghcr.io). Ein Image, das irgendeinen der Tests nicht besteht,
# landet NIE auf ":latest" (nur unter dem Commit-SHA-Tag, zur Diagnose).
# Läuft automatisch bei jedem Push auf main (nur wenn sich backend/,
# frontend/ oder dieser Workflow geändert haben) und lässt sich
# zusätzlich manuell auslösen.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (für arm64-Builds, z.B. Raspberry Pi / ARM-NAS)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur mit dem Commit-SHA getaggt - ":latest" wird erst ganz am Ende
      # (Job "promote") gesetzt, wenn wirklich alle Tests grün sind.
      - name: Build and push (SHA tag only)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/servicebuch-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Testet BEIDE Plattformen (amd64 UND arm64, über QEMU-Emulation) -
      # ein Bug, der nur unter einer Architektur auftritt (z.B. Prisma auf
      # Alpine/musl/arm64), wird damit vor der Veröffentlichung erkannt.
      # Ruft zusätzlich POST /api/auth/register auf: /api/health allein
      # prüft nur "Prozess läuft", register() übt dagegen Argon2 (natives
      # Modul!) und einen echten Prisma-Datenbank-Write aus.
      - name: Smoke test backend image (amd64 + arm64)
        if: matrix.service == 'backend'
        run: |
          set -e
          for platform in linux/amd64 linux/arm64; do
            name="smoke-$(echo $platform | tr '/' '-')"
            echo "=== Testing $platform ==="
            docker run -d --name "$name" --platform "$platform" \
              -e DATABASE_URL=file:/app/data/dev.db \
              -e DATA_DIR=/app/data \
              -p 4000:4000 \
              ghcr.io/${{ github.repository_owner }}/servicebuch-backend:${{ github.sha }}
            ok=""
            for i in $(seq 1 30); do
              if curl -sf http://localhost:4000/api/health >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "--- $platform container logs ---"
              docker logs "$name" || true
              docker rm -f "$name" || true
              echo "::error::Backend-Image ($platform) ist nicht gesund geworden (siehe Logs oben)."
              exit 1
            fi
            reg_code=$(curl -s -o /tmp/register_response.json -w "%{http_code}" \
              -X POST http://localhost:4000/api/auth/register \
              -H "Content-Type: application/json" \
              -d '{"email":"smoketest@example.com","password":"SmokeTest123!","name":"Smoke Test"}')
            echo "--- $platform container logs ---"
            docker logs "$name" || true
            docker rm -f "$name" || true
            if [ "$reg_code" != "201" ]; then
              echo "--- register response ---"
              cat /tmp/register_response.json || true
              echo "::error::Backend-Image ($platform): POST /api/auth/register lieferte HTTP $reg_code statt 201 (siehe Logs/Response oben)."
              exit 1
            fi
            echo "$platform OK (health + register/Argon2/Prisma-Write)"
          done
          echo "Backend-Smoke-Test erfolgreich (amd64 + arm64)."

      - name: Smoke test frontend image (amd64 + arm64)
        if: matrix.service == 'frontend'
        run: |
          set -e
          for platform in linux/amd64 linux/arm64; do
            name="smoke-$(echo $platform | tr '/' '-')"
            echo "=== Testing $platform ==="
            docker run -d --name "$name" --platform "$platform" -p 3000:3000 \
              ghcr.io/${{ github.repository_owner }}/servicebuch-frontend:${{ github.sha }}
            ok=""
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 2
            done
            echo "--- $platform container logs ---"
            docker logs "$name" || true
            docker rm -f "$name" || true
            if [ -z "$ok" ]; then
              echo "::error::Frontend-Image ($platform) liefert /login nicht aus (siehe Logs oben)."
              exit 1
            fi
            echo "$platform OK"
          done
          echo "Frontend-Smoke-Test erfolgreich (amd64 + arm64)."

  # Startet Backend + Frontend zusammen in einem echten Docker-Netzwerk -
  # exakt der Aufbau aus docker-compose.yml - und registriert einen
  # Nutzer über den Frontend-Proxy (Port 3000), nicht direkt am Backend.
  # Das ist der Test, der den echten Produktionsbug gefangen hätte: die
  # rewrites()-Route in next.config.js wurde beim BUILD ausgewertet (fixer
  # Wert im Image), nicht zur Laufzeit - im Einzel-Container-Smoke-Test
  # unsichtbar, weil dort kein zweiter Container involviert war.
  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Full-stack test (Frontend-Proxy -> Backend über Docker-Netzwerk)
        run: |
          set -x
          docker network create sb-test-net

          docker run -d --name sb-test-backend --network sb-test-net \
            -e DATABASE_URL=file:/app/data/dev.db \
            -e DATA_DIR=/app/data \
            ghcr.io/${{ github.repository_owner }}/servicebuch-backend:${{ github.sha }}
          echo "backend docker run exit: $?"

          docker run -d --name sb-test-frontend --network sb-test-net \
            -e BACKEND_INTERNAL_URL=http://sb-test-backend:4000 \
            -p 3000:3000 \
            ghcr.io/${{ github.repository_owner }}/servicebuch-frontend:${{ github.sha }}
          echo "frontend docker run exit: $?"

          docker ps -a
          sleep 3
          docker ps -a
          echo "--- backend logs (early) ---"
          docker logs sb-test-backend || true
          echo "--- frontend logs (early) ---"
          docker logs sb-test-frontend || true

          ok=""
          for i in $(seq 1 30); do
            docker exec sb-test-backend wget -q --spider http://localhost:4000/api/health
            code=$?
            echo "health check attempt $i exit: $code"
            if [ "$code" = "0" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Backend im Testnetzwerk nicht gesund geworden."
            docker logs sb-test-backend || true
            exit 1
          fi

          reg_code=$(curl -s -o /tmp/reg.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"integration@example.com","password":"IntegrationTest123!","name":"Integration Test"}')

          echo "--- frontend logs ---"
          docker logs sb-test-frontend || true
          echo "--- backend logs ---"
          docker logs sb-test-backend || true
          docker rm -f sb-test-frontend sb-test-backend || true
          docker network rm sb-test-net || true

          if [ "$reg_code" != "201" ]; then
            echo "--- register response ---"
            cat /tmp/reg.json || true
            echo "::error::Integrationstest fehlgeschlagen: Registrierung über den Frontend-Proxy (Port 3000 -> BACKEND_INTERNAL_URL) lieferte HTTP $reg_code statt 201."
            exit 1
          fi
          echo "Integrationstest erfolgreich: Frontend-Proxy erreicht das Backend exakt wie in docker-compose.yml."

  # Kopiert die bereits gepushten (und getesteten) Multi-Arch-Manifeste auf
  # den Tag ":latest" - kein erneuter Build nötig. Läuft nur, wenn ALLE
  # Einzel- UND der Integrationstest erfolgreich waren.
  promote:
    needs: [build-and-push, integration-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote ${{ matrix.service }} to :latest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/servicebuch-${{ matrix.service }}:latest \
            ghcr.io/${{ github.repository_owner }}/servicebuch-${{ matrix.service }}:${{ github.sha }}
